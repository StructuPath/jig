# plan-build-test.yaml — the code-phase repair edge (U9, KTD2). Plan the
# change, build it, then run the repository's own test command; a failing
# test suite routes its adapter envelope back to the builder and re-runs the
# suite, bounded by the edge's budget.
#
#   jig run --def examples/definitions/plan-build-test.yaml <repo> "add a --version flag"
#
# The repair edge is the whole point. A code phase's failure is nonzero exit
# (R8), and the adapter envelope that carries the exit status and output tail
# enters the repair loop through exactly the same door an agent's failing
# report would — so "the tests broke" is a workflow state, not an incident.
# `budget: 2` bounds it and `exhausted: fail-job` means a suite that is still
# red after two repair rounds fails the job rather than shipping.
#
# TWO THINGS TO EDIT before using this on your own repository:
#
#   1. The test phase's command. It detects the common entry points, and
#      fails loudly when it finds none — an undetected test command must
#      never look like a green run. Replace it with your repository's real
#      command.
#   2. The builder's `writes` allowlist. `**` permits every path in the
#      worktree, which is the honest default for an open-ended build but the
#      weakest write boundary jig can enforce (R10). Narrow it to the
#      directories the work belongs in.
#
# THE ROSTER. The builder writes the code, so it runs on `opus`; the planner
# only reads and plans, on `sonnet`. `effort: medium` sets how much the
# builder thinks and verifies while building to a plan — the test phase is
# its check. Leave `effort` out to take the CLI's default for the model.
name: plan-build-test
roster:
  planner:
    model: sonnet
    system_prompt: |
      You are a read-only planner working in a git repository. You never
      create, modify, or delete any file; you produce a plan the builder
      will execute, and you report exclusively through your final JSON
      envelope.
    user_prompt: |
      Task: {{prompt}}

      Read enough of this repository to plan the change: which files to
      touch, in what order, and how the result will be verified by the
      repository's own test command.

      Your final JSON must also include:
        - "notes_for_next_agent": the plan itself, concrete enough to
          execute without re-deriving it
    env: [PATH]
    writes: []
  builder:
    model: opus
    effort: medium
    system_prompt: |
      You are a builder working in a git repository. You execute the plan
      you are handed, you write only what the task requires, and you report
      honestly: claim only files you actually created or modified.

      When you are handed a failing test result, fix the cause the failure
      names. Do not weaken, skip, or delete a test to make it pass.
    user_prompt: |
      Task: {{prompt}}

      The plan and any previous phase's report are above. Make the change,
      then stop — the test suite runs as its own phase.

      Your final JSON must also include:
        - "changed_files": the repo-relative paths of every file you
          created or modified
        - "artifacts": the same paths, for existence verification
    env: [PATH]
    writes: ["**"]
phases:
  - name: plan
    kind: agent
    owner: planner
  - name: build
    kind: agent
    owner: builder
    gates:
      - {name: artifacts_exist}
      - {name: diff_matches_claims}
  - name: test
    kind: code
    owner: builder
    command: >
      if [ -f Justfile ] || [ -f justfile ]; then just test;
      elif [ -f Makefile ]; then make test;
      elif [ -f go.mod ]; then go test ./...;
      elif [ -f package.json ]; then npm test --silent;
      else echo "plan-build-test: no test command detected — edit the test phase"; exit 1; fi
    on_fail: {run: build, then: rerun-self, budget: 2, exhausted: fail-job}
acceptance: [all_phases_passed, artifacts_exist, diff_matches_claims]
