# simple-sdlc.yaml — the agent-phase repair edge, a conditional retest, and
# per-phase commit messages (U9, KTD2). Plan, build, commit, test, review;
# a review that rejects sends the work back to the builder and re-reviews,
# and the retest fires only when a revision actually happened.
#
#   jig run --def examples/definitions/simple-sdlc.yaml <repo> "add a --version flag"
#
# THE REPAIR EDGE. `on_fail.when: "approved == false"` is the declared
# envelope predicate (KTD2): a review whose own verdict says no dispatches
# the builder with the REVIEW's envelope as its input — the reviewer's
# blocking items are literally what the builder is handed — and then re-runs
# the review. `budget: 2` bounds the loop and `exhausted: fail-job` means
# work the reviewer never accepts does not ship.
#
# THE CONDITIONAL RETEST. The builder sets "revised": true only when it was
# dispatched to fix a review, so `if: revised` runs the commit and the retest
# exactly when a revision occurred, and skips them otherwise. A skipped phase
# is the definition behaving, and acceptance treats it as such.
#
# PER-PHASE COMMIT MESSAGES. Each writing phase composes its own commit
# message into $HOME/commit-message — its EPHEMERAL home (KTD11), which lives
# outside the worktree and dies with the attempt, so a scratch note can never
# ship in the published diff. The commit phase reads it with `git commit -F`:
# no agent-authored text ever reaches a command line, and a phase that wrote
# no message still commits, under a jig-composed fallback.
#
# EDIT BEFORE USE: the test command (it detects common entry points and
# fails loudly when it finds none) and the builder's `writes` allowlist
# (`**` is the weakest boundary jig can enforce — narrow it, R10).
#
# THE ROSTER. The builder and reviewer write and judge code, so they run on
# `opus`; the planner only reads and plans, on `sonnet`. `effort` sets how
# much each role thinks and verifies: medium for building to a plan, high
# for a reviewer whose job is the edge cases a build missed. Leave `effort`
# out to take the CLI's default for the model.
name: simple-sdlc
roster:
  planner:
    model: sonnet
    system_prompt: |
      You are a read-only planner working in a git repository. You never
      create, modify, or delete any file; you produce a plan the builder
      will execute, and you report exclusively through your final JSON
      envelope.
    user_prompt: |
      Task: {{prompt}}

      Read enough of this repository to plan the change: which files to
      touch, in what order, and how the result will be verified.

      Your final JSON must also include:
        - "notes_for_next_agent": the plan itself, concrete enough to
          execute without re-deriving it
    env: [PATH]
    writes: []
  builder:
    model: opus
    effort: medium
    system_prompt: |
      You are a builder working in a git repository. You execute the plan
      you are handed, you write only what the task requires, and you report
      honestly: claim only files you actually created or modified.

      You are run twice in some jobs. The first time you are handed a plan.
      The second time you are handed a REVIEW that rejected your work — its
      "blocking" list is what you must fix. Never weaken or delete a test to
      satisfy a reviewer.

      Before you finish, write your commit message — one subject line, then
      a blank line, then why — to the file $HOME/commit-message. It is your
      own ephemeral home, outside the repository; it is never committed as a
      file, and jig uses it as the message of the commit that carries your
      work.
    user_prompt: |
      Task: {{prompt}}

      The previous phase's report is above. If it is a review with
      "approved": false, fix every blocking item it names. Otherwise,
      execute the plan.

      Write $HOME/commit-message, then report.

      Your final JSON must also include:
        - "changed_files": the repo-relative paths of every file you
          created or modified
        - "artifacts": the same paths, for existence verification
        - "revised": true ONLY if you were fixing a review's blocking
          items on this run; false when you were executing the plan
    env: [PATH]
    writes: ["**"]
  reviewer:
    model: opus
    effort: high
    system_prompt: |
      You are a read-only reviewer. You judge the change against the task
      and the repository's own conventions, and you never create, modify, or
      delete any file.

      A finding is a requirement you checked, with "met" true or false. Your
      verdict must agree with your findings: never approve while a finding
      is unmet or a blocking item stands. Never report "revised" — that
      field belongs to the builder.

      Your "status" is "success" whenever you completed the review. The
      verdict travels in "approved", never in "status": a rejection you
      reported correctly is a phase that worked.
    user_prompt: |
      Task: {{prompt}}

      Review the change in this worktree — `git diff HEAD~1` shows the
      committed work, and any uncommitted changes are a revision in
      progress.

      Your final JSON must also include:
        - "approved": true when the change is complete and correct
        - "findings": a list of {"requirement": "<what you checked>",
          "met": true|false, "evidence": "<path or observation>"}
        - "blocking": a list of strings naming exactly what must change
          before approval (an empty list when you approve)
    env: [PATH]
    writes: []
phases:
  - name: plan
    kind: agent
    owner: planner
  - name: build
    kind: agent
    owner: builder
    gates:
      - {name: artifacts_exist}
      - {name: diff_matches_claims}
  # The commit phases stage with `git add -A` deliberately: by the time a
  # code phase runs, the write boundary has already verified every path the
  # agent changed against its allowlist and rolled back anything else (R10),
  # so what is left in the worktree is exactly the authorized work. (Publish
  # is the place that must never `git add -A` — there the changed-path list
  # is the contract.)
  - name: commit-build
    kind: code
    owner: builder
    command: |
      set -e
      message="$HOME/commit-message"
      git add -A
      if git diff --cached --quiet; then
        echo "commit-build: nothing to commit"
        exit 0
      fi
      if [ -s "$message" ]; then
        git -c user.name=jig -c user.email=jig@localhost \
            -c core.hooksPath=/dev/null commit -q -F "$message"
        rm -f "$message"
      else
        echo 'commit-build: the build phase wrote no $HOME/commit-message; using the fallback'
        git -c user.name=jig -c user.email=jig@localhost \
            -c core.hooksPath=/dev/null commit -q -m "jig: build phase"
      fi
  - name: test
    kind: code
    owner: builder
    command: >
      if [ -f Justfile ] || [ -f justfile ]; then just test;
      elif [ -f Makefile ]; then make test;
      elif [ -f go.mod ]; then go test ./...;
      elif [ -f package.json ]; then npm test --silent;
      else echo "simple-sdlc: no test command detected — edit the test phase"; exit 1; fi
  - name: review
    kind: agent
    owner: reviewer
    gates:
      - {name: verdict_consistent}
    on_fail: {when: "approved == false", run: build, then: rerun-self, budget: 2, exhausted: fail-job}
  - name: commit-revision
    kind: code
    owner: builder
    if: revised
    command: |
      set -e
      message="$HOME/commit-message"
      git add -A
      if git diff --cached --quiet; then
        echo "commit-revision: nothing to commit"
        exit 0
      fi
      if [ -s "$message" ]; then
        git -c user.name=jig -c user.email=jig@localhost \
            -c core.hooksPath=/dev/null commit -q -F "$message"
        rm -f "$message"
      else
        echo 'commit-revision: the builder wrote no $HOME/commit-message; using the fallback'
        git -c user.name=jig -c user.email=jig@localhost \
            -c core.hooksPath=/dev/null commit -q -m "jig: revision after review"
      fi
  - name: retest
    kind: code
    owner: builder
    if: revised
    command: >
      if [ -f Justfile ] || [ -f justfile ]; then just test;
      elif [ -f Makefile ]; then make test;
      elif [ -f go.mod ]; then go test ./...;
      elif [ -f package.json ]; then npm test --silent;
      else echo "simple-sdlc: no test command detected — edit the retest phase"; exit 1; fi
acceptance: [all_phases_passed, verdict_consistent, diff_matches_claims]
