name: Release

# Tag-driven: pushing v* builds the four platform binaries and attaches them
# to a GitHub release. Every action is pinned by commit SHA (R19) — a release
# workflow that resolves a floating tag is a supply chain with a hole in it.
on:
  push:
    tags:
      - "v*"
  # Manual runs build and upload the artifacts without publishing a release,
  # so the cross-compile can be exercised before a tag exists.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release that skips the checks is a release nobody verified. This is the
  # whole CI workflow — Linux, macOS, races, and the committed UI bundle — run
  # on the commit being released, which need not be on main.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Cross-compiled binaries
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Only the publish step needs write, and only on a pushed tag.
      contents: write
    env:
      # A manual run on a v* tag still only builds: publishing takes a push.
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Unpublished builds are named for the exact commit: a branch name can
      # hold a slash, which would split the archive path, and a tag name on a
      # build that is not the release would pass for one.
      - name: Build release artifacts
        run: |
          if [ "$PUBLISH" = true ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA}"
          fi
          scripts/release.sh "$version"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jig-binaries
          path: dist/
          if-no-files-found: error

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
